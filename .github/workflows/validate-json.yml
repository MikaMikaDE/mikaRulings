name: Validate JSON

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse every tracked .json file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! err=$(jq empty "$f" 2>&1); then
              echo "::error file=$f::invalid JSON"
              echo "$f -> $err"
              status=1
            fi
          done < <(git ls-files -z -- '*.json')
          exit $status
